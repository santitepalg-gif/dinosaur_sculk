
name: Build Forge Mod 1.20.1

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Revisar archivos
        run: |
          ls -la
          find . -maxdepth 4 -type f | sort

      - name: Comprobar Gradle
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          elif [ -f gradlew.bat ]; then
            echo "Existe gradlew.bat, pero falta el wrapper de Linux."
            exit 1
          else
            echo "No existe gradlew. Hay que configurar Gradle Wrapper."
            exit 1
          fi
