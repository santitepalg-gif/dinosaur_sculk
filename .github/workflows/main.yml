
name: Build Forge Mod 1.20.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        run: chmod +x gradlew

      - name: Compilar mod
        run: ./gradlew build --no-daemon

      - name: Guardar archivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: dinosaur-sculk-1.20.1
          path: build/libs/*.jar
